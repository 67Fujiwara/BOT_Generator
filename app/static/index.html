<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bot-team</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<script>try{const t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}</script>
<script src="/static/vendor/marked.min.js"></script><!-- marked v12.0.2 (MIT) を同梱: 社内ネットワークで CDN が塞がれていても Markdown と画像が出るように -->
<style>
:root{
  --bg:#F7F8FA; --side:#FFFFFF; --surface:#FFFFFF; --bubble:#F1F2F5; --ink:#1A2230; --muted:#6B7684;
  --line:#E3E6EB; --accent:#1F5FBF; --accent-ink:#FFF; --caution:#F2C32A; --err:#B3261E;
  --mono:ui-monospace,"SF Mono",Consolas,monospace;
}
/* テーマ: 既定は OS に合わせる。⚙ で ライト / ダーク に固定できる（<html data-theme="light|dark">）。
   color-scheme でスクロールバー・入力欄・<dialog> などのネイティブ部品もテーマに合わせる */
:root{ color-scheme:light; --code-bg:rgba(0,0,0,.06); --shadow:rgba(0,0,0,.25) }
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ color-scheme:dark; --bg:#14181D; --side:#1B2026; --surface:#1B2026; --bubble:#232A32; --ink:#E7EBEF; --muted:#9AA5B1; --line:#2E353D; --accent:#5A8FE0; --code-bg:rgba(255,255,255,.07); --shadow:rgba(0,0,0,.55) }
}
:root[data-theme="dark"]{ color-scheme:dark; --bg:#14181D; --side:#1B2026; --surface:#1B2026; --bubble:#232A32; --ink:#E7EBEF; --muted:#9AA5B1; --line:#2E353D; --accent:#5A8FE0; --code-bg:rgba(255,255,255,.07); --shadow:rgba(0,0,0,.55) }
*{scrollbar-width:thin}
*{box-sizing:border-box} html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14.5px/1.7 "Noto Sans JP",system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;
  display:grid;grid-template-columns:270px 1fr 300px;grid-template-rows:100%;overflow:hidden}

/* ── 左: ボット一覧 ── */
aside.left{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.left-top{display:flex;align-items:center;gap:8px;padding:12px 14px 8px}
.left-top h1{font-size:15px;font-weight:700;margin:0;flex:1}
.icon-btn{border:1px solid var(--line);background:none;color:var(--ink);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1}
.icon-btn:hover{background:var(--bubble)}
.left-top input{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;background:var(--bg);color:var(--ink)}
.groups{overflow-y:auto;flex:1;padding:4px 8px 16px}
.group-name{font-size:12px;color:var(--muted);padding:14px 8px 4px}
.item{display:flex;gap:10px;align-items:center;padding:8px;border-radius:8px;cursor:pointer;border:0;background:none;width:100%;text-align:left;font:inherit;color:var(--ink)}
.item:hover{background:var(--bubble)} .item[aria-current="true"]{background:var(--bubble);outline:1px solid var(--line)}
/* ブロブ型アイコン: 形と色はボットごとに固定（id から生成）、選択中だけ形がヌルっと変わる */
.avatar{width:34px;height:34px;flex:none;display:inline-block;vertical-align:middle;overflow:visible}
.avatar .body{filter:drop-shadow(0 1.5px 2px rgba(0,0,0,.28))}
.avatar .eyes{transform-box:fill-box;transform-origin:center}
.avatar .pupils{transition:transform .12s ease-out}
.avatar .body.fixed{transform-box:fill-box;transform-origin:center}
.avatar.live .body.fixed{animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1) rotate(0deg)}50%{transform:scale(1.05) rotate(-2deg)}}
.avatar.live .eyes{animation:blink 4.5s ease-in-out infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
.item .t{min-width:0;flex:1} .item .n{font-weight:500;line-height:1.3} .item .p{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .p.live{color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;display:none}
.item.busy .dot{display:block;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.3}}

/* ── 中央: 会話 ── */
section.center{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.topbar .avatar{width:26px;height:26px;font-size:12px}
.topbar .name{font-weight:700}
.topbar .spacer{flex:1}
.topbar button.plain{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;cursor:pointer}
.topbar button.plain:hover{color:var(--ink)}
.log{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:12px}
.empty{color:var(--muted);text-align:center;margin:auto;line-height:2}
.msg{max-width:min(720px,88%);padding:12px 16px;border-radius:12px;word-break:break-word}
.me{background:var(--accent);color:var(--accent-ink);align-self:flex-end;border-bottom-right-radius:3px;white-space:pre-wrap}
.me .files{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.me .files span{font:12px var(--mono);background:rgba(255,255,255,.18);padding:2px 8px;border-radius:4px}
.bot-msg{background:var(--bubble);align-self:flex-start;border-bottom-left-radius:3px}
.bot-head{display:flex;align-items:center;gap:6px;margin:-2px 0 6px;font-size:12px;color:var(--muted)} .bot-head .avatar{width:22px;height:22px}
.bot-chip{display:inline-flex;align-items:center;gap:5px;font-weight:600;vertical-align:-3px} .bot-chip .avatar{width:20px;height:20px;flex:none}
.relay{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:2px 0 6px;align-self:flex-start;max-width:720px} .relay .avatar{width:18px;height:18px;flex:none} .relay b{color:var(--fg)} .relay .arrow{opacity:.6} .relay q{font-style:normal;quotes:'「' '」'}
.msg.me.from-bot{background:var(--bg2,rgba(127,127,127,.12));color:var(--fg)} .msg.me.from-bot .bot-head{margin-bottom:4px}
.bot-msg>:first-child{margin-top:0} .bot-msg>:last-child{margin-bottom:0}
.bot-msg h1,.bot-msg h2,.bot-msg h3{font-size:15px;margin:14px 0 4px}
.bot-msg ul,.bot-msg ol{padding-left:22px;margin:4px 0}
.bot-msg table{border-collapse:collapse;margin:8px 0;font-size:13.5px;display:block;overflow-x:auto}
.bot-msg td,.bot-msg th{border:1px solid var(--line);padding:3px 10px;text-align:left}
.bot-msg code{font:13px var(--mono);background:var(--code-bg);padding:1px 4px;border-radius:3px}
.bot-msg pre{background:var(--code-bg);padding:10px;border-radius:8px;overflow-x:auto}
.bot-msg img{max-width:100%;max-height:320px;width:auto;height:auto;border:1px solid var(--line);border-radius:8px;margin:6px 0;display:block;cursor:zoom-in;background:#fff}
.bot-msg img.zoom{position:fixed;inset:0;margin:auto;max-height:96vh;max-width:96vw;z-index:60;cursor:zoom-out;background:var(--surface);box-shadow:0 10px 40px rgba(0,0,0,.5)}
.meta{font-size:12px;color:var(--muted);align-self:flex-start;padding-left:4px}
.error{color:var(--err);align-self:flex-start;font-size:13.5px}

.status{display:flex;align-items:center;gap:8px;padding:6px 24px;font-size:13px;color:var(--muted);min-height:34px}
.status .avatar{width:20px;height:20px;font-size:10px}
.status:empty{display:none}

.composer{padding:8px 20px 16px;background:var(--surface);border-top:1px solid var(--line)}
.attached{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px} .attached:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;font:12px var(--mono);background:var(--bubble);border:1px solid var(--line);padding:3px 4px 3px 9px;border-radius:6px}
.chip button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:14px;line-height:1;padding:0 4px}
.row{display:flex;gap:8px;align-items:flex-end;border:1px solid var(--line);border-radius:12px;padding:6px 8px 6px 6px;background:var(--bg)}
.row:focus-within{border-color:var(--accent)}
textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;line-height:1.6;min-height:36px;max-height:220px;padding:6px 4px}
.send{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:500;cursor:pointer}
.send:disabled{opacity:.45;cursor:default}
.rec{font-size:16px} .rec.on{background:var(--err);color:#fff;animation:pulse 1.2s infinite}
.rec-time{font:12px var(--mono);color:var(--err);align-self:center;min-width:52px;text-align:center} .rec-time:empty{display:none}
.live-box{max-width:min(820px,92%);width:100%} .live-text{white-space:pre-wrap;font-size:13.5px;line-height:1.7} .live-text:empty::before{content:"（まだ文字はありません）";color:var(--muted)}

/* ── 右: ボット詳細 ── */
aside.right{background:var(--side);border-left:1px solid var(--line);overflow-y:auto;overflow-x:hidden;padding:28px 18px;min-width:0}
.right .hero{text-align:center;margin-bottom:14px}
.right .hero .avatar{width:64px;height:64px;font-size:26px;margin:0 auto 10px}
.right .hero .n{font-weight:700;font-size:16px}
.tabs{display:flex;justify-content:center;flex-wrap:wrap;gap:2px;margin-bottom:14px}
.tabs button{border:0;background:none;color:var(--muted);font:inherit;font-size:12.5px;padding:5px 9px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--bubble);color:var(--ink)}
.pane{font-size:13.5px} .pane dt{color:var(--muted);font-size:12px;margin-top:12px} .pane dd{margin:2px 0 0}
.pane .mono{font:12px var(--mono);word-break:break-all}
.toollog{font:12px var(--mono);color:var(--muted);border-left:2px solid var(--line);padding-left:10px;margin:0;white-space:pre-wrap;max-height:50vh;overflow-y:auto}
.filelist{list-style:none;padding:0;margin:0} .filelist li{font:12px var(--mono);padding:4px 0;border-bottom:1px solid var(--line);word-break:break-all}
/* タスク（右パネル常設タブ） */
.tabs button .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:999px;background:var(--err);color:#fff;font-size:11px;line-height:18px;text-align:center}
.tabs button .badge:empty{display:none}
.task-add{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.task-add input{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;background:var(--bg);color:var(--ink)}
.task-add .row2{display:flex;gap:6px} .task-add .row2 input{flex:1} .task-add button{border:1px solid var(--line);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.tasklist{list-style:none;padding:0;margin:0}
.tasklist li{display:grid;grid-template-columns:22px 1fr auto auto;gap:4px 6px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.tasklist input[type=checkbox]{width:16px;height:16px;margin-top:3px;cursor:pointer}
.tasklist .tt{font-size:13.5px;line-height:1.5;word-break:break-word} .tasklist li.done .tt{color:var(--muted);text-decoration:line-through}
.tasklist .due{font-size:12px;color:var(--muted);margin-top:2px}
.tasklist .st{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--bubble);color:var(--muted);white-space:nowrap}
.tasklist .st.期限切れ,.tasklist .st.すぐ{background:var(--err);color:#fff} .tasklist .st.今日まで{background:var(--caution);color:#1A2230} .tasklist .st.期間内{background:var(--accent);color:#fff}
.tasklist .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;padding:2px 2px} .tasklist .x:hover{color:var(--err)}
.tasklist .note{grid-column:2/5;font-size:12px;color:var(--muted)}
.task-foot{display:flex;gap:10px;align-items:center;margin-top:10px;font-size:12px;color:var(--muted)} .task-foot button{border:0;background:none;color:var(--muted);cursor:pointer;font:inherit;font-size:12px;text-decoration:underline}
/* 催促ポップアップ */
.toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:50;max-width:min(380px,92vw)}
.toast{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--err);border-radius:10px;padding:10px 12px;box-shadow:0 6px 24px var(--shadow);font-size:13px;animation:toastin .25s ease-out}
.toast .tl{font-weight:600;margin-bottom:4px} .toast .tb{display:flex;gap:6px;margin-top:8px}
.toast .tb button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:6px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer}
.toast .tb button.p{background:var(--accent);color:#fff;border-color:var(--accent)}
@keyframes toastin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.toast.reply{border-left-color:var(--c,var(--accent));display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;cursor:pointer}
.toast.reply .avatar{width:40px;height:40px}
.toast.reply .who{font-weight:700;font-size:13px} .toast.reply .say{font-size:14px;margin:1px 0} .toast.reply .snip{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* サンプル置き場（右パネル） */
.samples{margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
.samples h3{font-size:12px;color:var(--muted);margin:0 0 4px;font-weight:500}
.slot{margin:8px 0 10px}
.slot .slot-h{display:flex;align-items:center;gap:8px}
.slot .slot-h b{font-weight:500;font-size:13px;flex:1}
.slot .add{border:1px solid var(--line);background:none;color:var(--accent);font:inherit;font-size:12px;border-radius:999px;padding:2px 10px;cursor:pointer}
.slot .add:hover{background:var(--bubble)}
.slot ul{list-style:none;padding:0;margin:4px 0 0}
.slot li{display:flex;align-items:center;gap:6px;font:12px var(--mono);padding:3px 0;word-break:break-all}
.slot li span{flex:1}
.slot li button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;padding:0 4px}
.slot li button:hover{color:var(--err)}
.slot .none{font-size:12px;color:var(--muted);margin-top:2px}
.slot.over{outline:2px dashed var(--accent);outline-offset:4px;border-radius:6px}

/* ドラッグ中: 画面を薄く暗くして、アクセント色の点線枠と中央ラベル */
body.drag::before{content:"";position:fixed;inset:0;z-index:40;background:rgba(10,14,20,.45);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);pointer-events:none}
body.drag::after{content:"";position:fixed;inset:14px;z-index:41;pointer-events:none;border:2px dashed var(--accent);border-radius:18px;
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:var(--accent-ink);
  background:radial-gradient(ellipse at center,rgba(31,95,191,.10),transparent 60%);animation:dropPulse 1.6s ease-in-out infinite}
body.drag::after{padding-top:0}
body.drag .drop-pill{display:flex}
.drop-pill{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:42;pointer-events:none;align-items:center;gap:10px;
  padding:14px 22px;border-radius:999px;background:var(--surface);color:var(--ink);box-shadow:0 12px 40px var(--shadow);border:1px solid var(--line);font-size:14px;font-weight:600}
.drop-pill svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@keyframes dropPulse{0%,100%{border-color:var(--accent);opacity:.9}50%{border-color:color-mix(in srgb,var(--accent) 45%,transparent);opacity:1}}
@media (prefers-reduced-motion:reduce){ body.drag::after{animation:none} }
/* ── 設定ダイアログ ── */
dialog.settings{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:22px 24px;width:min(460px,92vw);max-height:92vh;overflow:auto;font:inherit}
dialog.settings::backdrop{background:rgba(0,0,0,.35)}
dialog.settings h2{font-size:16px;margin:0 0 6px}
dialog.settings p{margin:6px 0;font-size:13px;color:var(--muted)}
dialog.settings label{display:block;font-size:12px;color:var(--muted);margin-top:14px}
dialog.settings input,dialog.settings .set-field{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:13px var(--mono);background:var(--bg);color:var(--ink);margin-top:4px}
dialog.settings .set-field{font:inherit;font-size:13px}
dialog.settings details summary{cursor:pointer;font-size:13px;color:var(--muted);margin-top:14px}
dialog.settings a{color:var(--accent)}
dialog.settings .btns{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
dialog.settings .btns .spacer{flex:1}
dialog.settings button{font:inherit;font-size:13px;border-radius:8px;padding:7px 14px;cursor:pointer;border:1px solid var(--line);background:none;color:var(--ink)}
dialog.settings button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
dialog.settings button:disabled{opacity:.5;cursor:default}
.set-status{font-size:13px;margin-top:10px;min-height:1.6em;white-space:pre-wrap}
.set-status.ok{color:#2E8B57} .set-status.ng{color:var(--err)}
@media (max-width:980px){ body{grid-template-columns:230px 1fr} aside.right{display:none} }
@media (prefers-reduced-motion:reduce){ .item.busy .dot{animation:none} .avatar.live .eyes,.avatar.live .body.fixed{animation:none} }
</style>
</head>
<body>

<aside class="left">
  <div class="left-top"><h1>bot-team <span id="ver" style="font:11px var(--mono);color:var(--muted);font-weight:400;margin-left:4px" title="版（コミット番号と日付）"></span></h1><button class="icon-btn" id="powerBtn" title="サーバーを終了する（次回は run.bat から）">⏻</button><button class="icon-btn" id="settingsBtn" title="設定（API キー）">⚙</button><button class="icon-btn" id="newBot" title="ボットを追加する（.claude/agents にファイルを置く）">＋</button></div>
  <div class="left-top" style="padding-top:0"><input id="filter" placeholder="ボットを探す"></div>
  <div class="groups" id="groups"></div>
</aside>

<section class="center">
  <div class="topbar"><span class="avatar" id="topAvatar">?</span><span class="name" id="topName">ウッディ</span>
    <span class="spacer"></span><button class="plain" id="newChat">新しい会話</button></div>
  <div class="log" id="log"></div>
  <div class="status" id="status"></div>
  <div class="composer">
    <div class="attached" id="attached"></div>
    <div class="row">
      <button class="icon-btn" id="pick" title="ファイルを選ぶ" style="border:0">＋</button>
      <button class="icon-btn rec" id="rec" title="マイクで録音（もう一度押すと停止して添付）" style="border:0" hidden>🎙</button>
      <span class="rec-time" id="recTime"></span>
      <textarea id="input" rows="1" placeholder="メッセージ（Enter で送信、Shift+Enter で改行。ファイルは画面のどこにでもドロップ）"></textarea>
      <button class="send" id="send">送信</button>
    </div>
    <input type="file" id="file" multiple hidden>
  </div>
</section>

<aside class="right">
  <div class="hero"><span class="avatar" id="rAvatar">?</span><div class="n" id="rName">ウッディ</div></div>
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-pane="detail">詳細</button>
    <button role="tab" aria-selected="false" data-pane="log">ログ</button>
    <button role="tab" aria-selected="false" data-pane="files">ファイル</button>
    <button role="tab" aria-selected="false" data-pane="tasks">タスク<span class="badge" id="taskBadge"></span></button>
    <button role="tab" aria-selected="false" data-pane="memory">メモリ</button>
  </div>
  <div class="pane" id="pane-detail"></div>
  <div class="pane" id="pane-log" hidden><pre class="toollog" id="toollog">（まだ何もしていません）</pre></div>
  <div class="pane" id="pane-files" hidden><ul class="filelist" id="filelist"></ul></div>
  <div class="pane" id="pane-memory" hidden><div class="samples" id="memory" style="border-top:0;padding-top:0;margin-top:0"><h3>覚えていること</h3></div></div>
  <div class="pane" id="pane-tasks" hidden>

<script>
const $=s=>document.querySelector(s);
const log=$('#log'), input=$('#input'), sendBtn=$('#send'), attachedEl=$('#attached'), statusEl=$('#status'), toollog=$('#toollog');
const AUTO={id:'_auto',nick:'ウッディ',desc:'おまかせ役。内容を見て適したボットに振り分けます。',group:'',model:'既定',tools:['Agent'],color:'#D98E5B',shape:'woody',say:'返事きたよ、見てみて',preview:''};
let bots=[], current=AUTO, pending=[], busy=new Set(), resetNext=false;
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const md=s=>window.marked?marked.parse(s,{breaks:true}):esc(s).replace(/\n/g,'<br>');
/* id からブロブの形を決める。点の数 3〜7（3 は丸い三角、4 は丸い四角…）を Catmull-Rom で滑らかに閉じる */
const hash=id=>{ let h=2166136261; for(const ch of String(id)){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; };
const rng=seed=>{ let t=seed>>>0; return ()=>{ t+=0x6D2B79F5; let r=Math.imul(t^t>>>15,1|t); r^=r+Math.imul(r^r>>>7,61|r); return ((r^r>>>14)>>>0)/4294967296; }; };
function blobPts(seed,frame){
  const r=rng(seed), n=3+Math.floor(r()*5), base=[];
  for(let i=0;i<n;i++) base.push([(i/n)*Math.PI*2+(r()-.5)*.6, 37+(r()-.5)*12]);
  const w=rng(seed*7+frame*131);
  return base.map(([a,rad])=>{ const da=frame?(w()-.5)*.25:0, dr=frame?(w()-.5)*12:0; return [50+Math.cos(a+da)*(rad+dr), 50+Math.sin(a+da)*(rad+dr)]; });
}
function toPath(p){
  const n=p.length, f=v=>v.toFixed(1); let d=`M${f(p[0][0])} ${f(p[0][1])}`;
  for(let i=0;i<n;i++){ const p0=p[(i-1+n)%n],p1=p[i],p2=p[(i+1)%n],p3=p[(i+2)%n];
    d+=`C${f(p1[0]+(p2[0]-p0[0])/6)} ${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)} ${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])} ${f(p2[1])}`; }
  return d+'Z';
}
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const hex2rgb=h=>{ h=h.replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join(''); const n=parseInt(h,16); return [n>>16&255,n>>8&255,n&255]; };
const mix=(c,t,a)=>{ const [r,g,b]=hex2rgb(c); return `rgb(${Math.round(r+(t[0]-r)*a)},${Math.round(g+(t[1]-g)*a)},${Math.round(b+(t[2]-b)*a)})`; };
let gid=0;
/* 固定シルエット（フロントマター shape: で指定）。d はパス、ex/ey は目の中心、dx は目の間隔の半分、er は目の半径 */
const SHAPES={
  buzz:  {d:'M8 78C8 62 18 56 28 54C24 8 76 8 72 54C82 56 92 62 92 78C92 90 80 93 72 93L28 93C20 93 8 90 8 78Z', ex:50, ey:36, dx:11, er:8},
  slinky:{d:'M8 46C8 28 36 26 38 44L38 50C55 48 72 48 86 50C90 44 94 38 96 36C97 44 94 54 90 60C92 70 86 74 78 74L30 74C20 74 14 70 12 60C8 56 8 52 8 46Z', ex:22, ey:40, dx:6, er:5},
  woody: {d:'M6 40C6 33 20 32 30 33C30 10 70 10 70 33C80 32 94 33 94 40C94 46 82 46 74 45C76 60 72 80 60 90C56 94 44 94 40 90C28 80 24 60 26 45C18 46 6 46 6 40Z', ex:50, ey:62, dx:10, er:7},
  alien: {d:'M50 6C53 6 54 9 52 12L52 18C70 18 84 30 86 48C92 46 96 52 92 58C88 60 86 58 86 56C84 76 70 90 50 92C30 90 16 76 14 56C14 58 12 60 8 58C4 52 8 46 14 48C16 30 30 18 48 18L48 12C46 9 47 6 50 6Z', ex:50, ey:52, dx:16, er:7, eyes3:true},
  jessie:{d:'M4 38C6 32 18 31 30 32C30 18 36 8 44 8C47 12 53 12 56 8C64 8 70 18 70 32C82 31 94 32 96 38C96 44 84 44 76 43C78 52 78 60 76 66C84 72 90 84 86 96C80 97 76 92 74 86C72 84 70 80 70 76C66 86 56 92 50 92C40 92 30 84 26 66C22 60 24 50 26 43C16 44 4 44 4 38Z', ex:50, ey:58, dx:10, er:7},
  potato:{d:'M36 24C34 2 66 2 64 24C72 24 74 27 70 29C78 33 82 40 84 48C92 50 94 64 84 66C82 84 68 96 50 96C32 96 18 84 16 66C6 64 8 50 16 48C18 40 22 33 30 29C26 27 28 24 36 24Z', ex:50, ey:54, dx:10, er:7.5},
  ham:   {d:'M22 44C14 36 14 24 20 22C26 20 32 26 34 28C44 22 60 22 70 28C74 24 82 20 86 24C90 30 86 38 82 42C92 56 90 78 76 88C64 94 40 94 28 86C18 80 14 70 16 60C8 58 6 48 12 46C14 44 18 44 22 44Z', ex:52, ey:46, dx:11, er:7},
  prospector:{d:'M2 36C2 30 16 29 30 30C30 10 70 10 70 30C84 29 98 30 98 36C98 41 86 42 76 41C78 52 78 60 76 66C86 72 88 84 82 94C72 98 60 96 50 97C40 96 28 98 18 94C12 84 14 72 24 66C22 60 22 52 24 41C14 42 2 41 2 36Z', ex:50, ey:52, dx:10, er:7},
  rex:   {d:'M6 42C20 28 44 20 64 22C84 24 94 38 92 56C90 70 82 80 68 82C60 84 54 82 50 78C46 88 34 94 20 92C10 90 4 84 6 76C10 72 24 70 44 70C40 64 30 58 20 54C14 52 8 50 6 48C4 46 4 44 6 42Z', ex:68, ey:40, dx:8, er:6.5},
};
const botHead=b=>`<div class="bot-head">${avatar(b,'avatar')}<span>${esc(b.nick)}</span></div>`;
const botMsg=(b,html)=>botHead(b)+html;
const botOf=id=>id==='_auto'?AUTO:(bots.find(x=>x.id===id)||null);
/* ボット間の連絡の 1 行（送り手 → 相手「内容」） */
function relayLine(fromId,fromNick,toId,toNick,kind,text){
  const f=botOf(fromId), t=botOf(toId);
  return `<div class="relay">${f?avatar(f):''}<b>${esc(fromNick)}</b><span class="arrow">${kind==='聞く'?'→ 聞く →':'→ 頼む →'}</span>${t?avatar(t):''}<b>${esc(toNick)}</b><q>${esc(text)}</q></div>`;
}
/* 履歴 1 件を描く。me: 本人（from があれば仲間からの連絡）/ bot: 返事（bot があれば仲間の返事）/ relay: 連絡の 1 行 */
function renderHist(b,m){
  if(m.role==='relay') return append('relay-wrap',relayLine(b.id,m.from,m.to_id,m.to,m.kind,m.text));
  if(m.role==='me'){
    if(m.from){ const f=bots.find(x=>x.nick===m.from)||(m.from==='ウッディ'?AUTO:null); return append('msg me from-bot',(f?`<div class="bot-head">${avatar(f)}<span>${esc(m.from)}からの連絡</span></div>`:'')+esc(m.text)); }
    return append('msg me',esc(m.text)+fileChips(m.files));
  }
  const who=(m.bot&&botOf(m.bot))||b;
  return append('msg bot-msg',botMsg(who,md(botChips(m.text))));
}
/* ウッディが他のボットの返事を伝えるとき、行頭の「🥔 ポテト」「**ハム:**」「レックス：」などを本物のアイコン付きの名前に置き換える
   （絵文字はボットが勝手に付けるので捨てる）。行頭以外の名前や、名前の後に文が続く行（「ポテトに頼んだよ」）はそのまま */
function botChips(text){
  const all=[AUTO,...bots]; if(!all.length||!text) return text;
  const names=all.map(b=>b.nick).filter(Boolean).sort((a,b)=>b.length-a.length).map(n=>n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');
  const re=new RegExp('^([ \\t]*(?:#{1,6}[ \\t]+|[-*][ \\t]+|\\d+\\.[ \\t]+)?)(\\*\\*|__)?(?:[\\p{Extended_Pictographic}\\uFE0F\\u200D\\u20E3]+[ \\t]*)?('+names+')(?:さん)?((?:[ \\t]*[:：])?(?:\\*\\*|__)?(?:[ \\t]*[:：])?)[ \\t]*','gmu');
  return text.replace(re,(m,pre,b1,nick,sep,off,str)=>{
    const b=all.find(x=>x.nick===nick); if(!b) return m;
    const colon=/[:：]/.test(sep||'');
    if(!colon){ const eol=str.slice(off+m.length).match(/^[^\n]*/)[0]; if(eol.trim()) return m; }
    const chip=`<span class="bot-chip">${avatar(b,'avatar').replace(/\n\s*/g,'')}${esc(nick)}</span>`;
    return pre+chip+(colon?'： ':'');
  });
}
const avatar=(b,cls='avatar',id='',live=false)=>{
  const seed=hash(b.id), g='g'+(++gid), sh=SHAPES[b.shape];
  const d0=sh?sh.d:toPath(blobPts(seed,0));
  const anim=live&&!reduced&&!sh?`<animate attributeName="d" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.33;.66;1" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1" values="${d0};${toPath(blobPts(seed,1))};${toPath(blobPts(seed,2))};${d0}"/>`:'';
  const ey=sh?sh.ey:43+(seed%3)*3, dx=sh?sh.dx:10+(seed>>3)%3, ex=sh?sh.ex:50, er=sh?sh.er:8, c=b.color, k=er/8;
  const eye=x=>`<circle cx="${x}" cy="${ey}" r="${er}" fill="#fff" stroke="rgba(0,0,0,.10)" stroke-width="${(1*k).toFixed(2)}"/>`;
  const pupil=x=>`<circle cx="${x}" cy="${(ey+.6*k).toFixed(2)}" r="${(4.2*k).toFixed(2)}" fill="#1A2230"/><circle cx="${(x-1.4*k).toFixed(2)}" cy="${(ey-1*k).toFixed(2)}" r="${(1.3*k).toFixed(2)}" fill="#fff" opacity=".9"/>`;
  return `<svg class="${cls}${live?' live':''}"${id?` id="${id}"`:''} viewBox="0 0 100 100" role="img" aria-label="${esc(b.nick)}">
    <defs><radialGradient id="${g}" cx="36%" cy="30%" r="78%"><stop offset="0" stop-color="${mix(c,[255,255,255],.55)}"/><stop offset=".4" stop-color="${mix(c,[255,255,255],.15)}"/><stop offset=".78" stop-color="${c}"/><stop offset="1" stop-color="${mix(c,[0,0,0],.32)}"/></radialGradient></defs>
    <path class="body${sh?' fixed':''}" fill="url(#${g})" d="${d0}">${anim}</path>
    <g class="eyes">${eye(ex-dx)}${eye(ex+dx)}${sh&&sh.eyes3?eye(ex).replace(`cy="${ey}"`,`cy="${ey-9}"`):''}<g class="pupils">${pupil(ex-dx)}${pupil(ex+dx)}${sh&&sh.eyes3?pupil(ex).replace(`cy="${(ey+.6*k).toFixed(2)}"`,`cy="${(ey-9+.6*k).toFixed(2)}"`).replace(`cy="${(ey-1*k).toFixed(2)}"`,`cy="${(ey-9-1*k).toFixed(2)}"`):''}</g></g></svg>`;
};
/* 瞳がマウスを追う（選択中のアイコンだけ）: アイコン中心からマウスへの向きに、最大 3.2 単位だけ瞳をずらす */
let mouse=null, eyeRaf=0;
function trackEyes(){
  eyeRaf=0;
  document.querySelectorAll('svg.avatar').forEach(sv=>{
    const g=sv.querySelector('.pupils'); if(!g) return;
    if(!sv.classList.contains('live')){ g.style.transform=''; return; }
    if(!mouse){ g.style.transform=''; return; }
    const r=sv.getBoundingClientRect(); if(!r.width) return;
    const cx=r.left+r.width/2, cy=r.top+r.height*.45;
    const er=parseFloat(sv.querySelector('.eyes circle')?.getAttribute('r')||8);
    const vx=mouse[0]-cx, vy=mouse[1]-cy, dist=Math.hypot(vx,vy)||1, m=Math.min(1,dist/140)*3.2*(er/8);
    g.style.transform=`translate(${(vx/dist*m).toFixed(2)}px,${(vy/dist*m).toFixed(2)}px)`;
  });
}
document.addEventListener('mousemove',e=>{ mouse=[e.clientX,e.clientY]; if(!eyeRaf) eyeRaf=requestAnimationFrame(trackEyes); });
document.addEventListener('mouseleave',()=>{ mouse=null; trackEyes(); });

async function loadBots(){
  bots=await (await fetch('/bots')).json();
  renderList();
}
function renderList(){
  const q=$('#filter').value.trim();
  const wrap=$('#groups'); wrap.innerHTML='';
  const groups={}; [...bots].filter(b=>!q||b.nick.includes(q)||b.desc.includes(q)).forEach(b=>(groups[b.group]??=[]).push(b));
  const mk=b=>{
    const el=document.createElement('button'); el.className='item'+(busy.has(b.id)?' busy':''); el.type='button';
    el.setAttribute('aria-current', String(current.id===b.id));
    const live=b.status; 
    el.innerHTML=`${avatar(b,'avatar','',current.id===b.id)}<span class="t"><div class="n">${esc(b.nick)}</div><div class="p ${live?'live':''}">${esc(live||b.preview||b.desc)}</div></span><span class="dot"></span>`;
    el.onclick=()=>select(b); return el;
  };
  wrap.appendChild(mk(AUTO));
  for(const [g,list] of Object.entries(groups)){
    const h=document.createElement('div'); h.className='group-name'; h.textContent=g; wrap.appendChild(h);
    list.forEach(b=>wrap.appendChild(mk(b)));
  }
}
async function select(b){
  current=b; renderList(); renderRight();
  $('#topAvatar').outerHTML=avatar(b,'avatar','topAvatar'); $('#topName').textContent=b.nick;
  log.innerHTML=''; statusEl.innerHTML='';
  const hist=b.id==='_auto'?[]:await (await fetch('/history/'+b.id)).json();
  if(!hist.length) log.innerHTML=`<div class="empty">${esc(b.desc)}<br>${sendKey==='ctrl'?'Ctrl+Enter で送信、Enter で改行':'Enter で送信、Shift+Enter で改行'}</div>`;
  hist.forEach(m=>renderHist(b,m));
  $('#rec').hidden=!b.record;
  /* ジェシー（タスク役）を選んだらタスクタブ、それ以外は詳細タブに戻す */
  document.querySelector(`.tabs button[data-pane="${b.tasks?'tasks':'detail'}"]`).click();
  input.focus();
}
/* ── タスク（ジェシー）: 右パネルの常設タブ。チャットが流れても残る。1 分ごとに見直して催促する ── */
let tasksCache=[], showDone=false, tasksToday='';
function dueText(t){ if(!t.due_end) return t.due_label||'納期なし'; const f=d=>d.slice(5).replace('-','/'); return `${t.due_label}: ${f(t.due_start)}${t.due_start!==t.due_end?'〜'+f(t.due_end):''}`; }
async function loadTasks(){
  let d; try{ d=await (await fetch('/tasks'+(showDone?'?all=1':''))).json(); }catch(e){ return; }
  tasksCache=d.tasks; tasksToday=d.today;
  const open=d.tasks.filter(t=>!t.done); $('#taskBadge').textContent=open.length||'';
  const ul=$('#tasklist'); ul.innerHTML='';
  if(!d.tasks.length){ ul.innerHTML='<li style="display:block;color:var(--muted);font-size:13px">タスクはありません。ジェシーに「〜やっといて、来週まで」のように言うか、上の欄から追加できます。</li>'; }
  d.tasks.forEach(t=>{
    const li=document.createElement('li'); li.className=t.done?'done':'';
    li.innerHTML=`<input type="checkbox" ${t.done?'checked':''} title="${t.done?'未完了に戻す':'完了にする'}"><div><div class="tt">${esc(t.title)}</div><div class="due">${esc(dueText(t))}</div></div><span class="st ${esc(t.status)}">${esc(t.status)}</span>${t.note?`<div class="note">${esc(t.note)}</div>`:''}<button class="x" title="削除">×</button>`;
    li.querySelector('input').onchange=async e=>{ await fetch(`/tasks/${t.id}/${e.target.checked?'done':'undone'}`,{method:'POST'}); loadTasks(); };
    li.querySelector('.x').onclick=async()=>{ if(confirm(`「${t.title}」を削除しますか？`)){ await fetch(`/tasks/${t.id}/remove`,{method:'POST'}); loadTasks(); } };

/* 催促のルール: 期限切れ・今日まで・「すぐ」は 2 時間ごと、期間内（今月中旬など）は 1 日 1 回。あとで→2 時間止める

const jessieBot=()=>bots.find(b=>b.tasks)||bots.find(b=>b.id==='jessie')||{id:'jessie',nick:'ジェシー',color:'#E35D4F',shape:'jessie'};

  return {'期限切れ':`「${n}」期限すぎてるよ！`,'今日まで':`「${n}」今日までだよ、忘れてない？`,'すぐ':`「${n}」すぐやるやつ、まだ？`,'期間内':`「${n}」そろそろ手つけよ〜（${t.due_label}）`}[t.status]||`「${n}」どうなった？`;
}
async function jessieNotify(title,body,tag){
  if(!('Notification' in window)||Notification.permission!=='granted') return;

function toastMany(list){

async function checkReminders(){
  const now=new Date(), H=3600e3, due=[];
  for(const t of tasksCache){
    if(t.done||!t.due_end) continue;
    if(t.snooze_until&&new Date(t.snooze_until)>now) continue;
    if(t.created&&(now-new Date(t.created))<1*H) continue;   // 登録したばかり（1 時間以内）は催促しない。登録した瞬間に「忘れてない？」が出ないように
    const last=t.last_reminded?new Date(t.last_reminded):null, since=last?now-last:Infinity;
    let fire=false;
    if(t.status==='期限切れ'||t.status==='今日まで') fire=since>2*H;
    else if(t.status==='すぐ') fire=since>2*H&&(now-new Date(t.created))>4*H;
    else if(t.status==='期間内') fire=!last||last.toDateString()!==now.toDateString();
    if(fire) due.push(t);
  }
  if(!due.length) return;
  if(due.length===1) toast(due[0]); else toastMany(due);
  for(const t of due){ await fetch(`/tasks/${t.id}/reminded`,{method:'POST'}); t.last_reminded=now.toISOString(); }
}

/* ── 返事の通知: 3 秒以上かかった返事、または別タブ・別アプリを見ている間の返事は、ボットのアイコン付きでポップアップ＋ブラウザ通知 ── */
const pngCache={};
function avatarPng(b){
  if(pngCache[b.id]) return Promise.resolve(pngCache[b.id]);
  return new Promise(res=>{
    const svg=avatar(b,'avatar').replace(/<animate[^>]*\/>/g,'').replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" ');
    const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'})); const im=new Image();
    im.onload=()=>{ try{ const c=document.createElement('canvas'); c.width=c.height=128; c.getContext('2d').drawImage(im,0,0,128,128); pngCache[b.id]=c.toDataURL('image/png'); }catch(e){} URL.revokeObjectURL(url); res(pngCache[b.id]||''); };
    im.onerror=()=>res(''); im.src=url;
  });
}

/* ── ライブ録音（スリンキー）: マイク（＋任意でオンライン会議のタブ音声）を 1 本に合成し、
   区切りごとに stop→start で完結した webm を作って /transcribe/chunk に順番に送る。
   文字は届き次第チャットに出し、停止すると全文を文字起こし txt として添付してスリンキーに送る。 ── */
let live=null;
function fmtT(sec){ const s=Math.floor(sec); return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
async function toggleRec(){
  if(live){ await stopLive(); return; }
  const b=current;
  const includeTab = confirm('Google Meet の音声（相手の声）も一緒に録りますか？\n\nOK → 次に出る共有の選択で「Chrome タブ」→ Meet のタブを選び、左下の「タブの音声も共有する」をオンにして「共有」。\n　　 （自分の声はマイクから録るので、Meet 側のマイクはそのままで構いません）\nキャンセル → マイクだけ録ります（対面会議向け）。');
  let mic, tab=null, ctx;
  try{ mic=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}); }
  catch(e){ alert('マイクを使えませんでした。ブラウザのマイク許可を確認してください。\n'+e.message); return; }
  ctx=new AudioContext(); const dest=ctx.createMediaStreamDestination(); ctx.createMediaStreamSource(mic).connect(dest);
  if(includeTab){
    try{ tab=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true}); tab.getVideoTracks().forEach(t=>t.stop());
      if(tab.getAudioTracks().length) ctx.createMediaStreamSource(tab).connect(dest); else alert('タブの音声が取れませんでした。共有の選択で「Chrome タブ」を選び、「タブの音声も共有する」をオンにしてください。今回はマイクだけで続けます。'); }
    catch(e){ tab=null; }
  }
  const mime=['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'].find(m=>MediaRecorder.isTypeSupported(m));
  const d=new Date(), pad=n=>String(n).padStart(2,'0');
  const meeting=`録音_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`;
  const chunkMs=((settingsCache.chunk_sec)||45)*1000, glossary=settingsCache.glossary||'';
  const st={bot:b,meeting,mic,tab,ctx,dest,mime,t0:Date.now(),seq:0,prev:'',stopping:false,rec:null,timer:0,queue:Promise.resolve(),lines:[],errors:0};
  live=st;
  // 画面: 会話欄にライブ本文の枠
  log.querySelector('.empty')?.remove();
  st.el=append('msg bot-msg live-box',botHead(b)+`<div class="meta" style="padding:0 0 6px">● 録音中だよ — 文字は ${chunkMs/1000} 秒ごとに出るね</div><div class="live-text"></div>`);
  const upload=async(blob,seq,startSec)=>{
    const fd=new FormData(); fd.append('audio',blob,`chunk-${seq}.webm`); fd.append('seq',seq); fd.append('startSec',startSec);
    fd.append('language','ja'); fd.append('glossary',glossary); fd.append('prev',st.prev); fd.append('meeting',meeting);
    const res=await fetch('/transcribe/chunk',{method:'POST',body:fd});
    if(!res.ok) throw new Error(`transcribe ${res.status}`);
    const r=await res.json();
    if(r.error){ st.errors++; setStatus(b,'文字起こしエラー: '+r.error); if(st.errors===1) append('error',esc(r.error)); return; }
    if(r.text){ st.prev=r.text.slice(-300); st.lines.push(`[${fmtT(startSec)}] ${r.text}`); const t=st.el.querySelector('.live-text'); t.textContent=st.lines.join('\n'); log.scrollTop=log.scrollHeight; }
  };
  const begin=()=>{
    const r=new MediaRecorder(dest.stream, mime?{mimeType:mime,audioBitsPerSecond:32000}:undefined);
    const chunks=[]; const startSec=(Date.now()-st.t0)/1000; const mySeq=st.seq++;
    r.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
    r.stopped=new Promise(res=>{ r.onstop=()=>{ const blob=new Blob(chunks,{type:r.mimeType||'audio/webm'});
      if(blob.size>=2000) st.queue=st.queue.then(()=>upload(blob,mySeq,startSec)).catch(e=>{ st.errors++; setStatus(b,'送信失敗: '+e.message); });
      res(); }; });
    r.start(); st.rec=r; clearTimeout(st.timer); st.timer=setTimeout(rotate,chunkMs);
  };
  /* 区切りを閉じて（onstop を待ってから）次を始める。停止時はその promise で最後の区切りが待ち行列に入ったことを確かめる */
  const rotate=()=>{ const cur=st.rec; if(!cur) return Promise.resolve(); st.rec=null; cur.stop(); if(!st.stopping) begin(); return cur.stopped; };
  st.rotate=rotate; begin();
  $('#rec').classList.add('on'); input.placeholder='録音中… 🎙 をもう一度押すと停止して議事録を作ります';
  st.clock=setInterval(()=>{ $('#recTime').textContent='● '+fmtT((Date.now()-st.t0)/1000); },500);
}
async function stopLive(){
  const st=live; if(!st) return; live=null;
  st.stopping=true; clearTimeout(st.timer); const lastStopped=st.rotate();
  $('#rec').classList.remove('on'); clearInterval(st.clock); $('#recTime').textContent='';
  setStatus(st.bot,'最後の区切りを文字にしています'); await lastStopped; await st.queue;
  st.mic.getTracks().forEach(t=>t.stop()); st.tab?.getTracks().forEach(t=>t.stop()); try{ await st.ctx.close(); }catch(e){}
  applySendKey(); setStatus(st.bot,'');
  st.el.querySelector('.meta').textContent=`■ 録音おわり（${fmtT((Date.now()-st.t0)/1000)}）。いま議事録にするね`;
  const text=st.lines.join('\n');
  if(!text.trim()){ append('error','文字が取れませんでした。マイクや文字起こしの設定（⚙）を確認してください。'); return; }
  const fd=new FormData(); fd.append('meeting',st.meeting); fd.append('text',text);
  try{ await fetch('/transcribe/finish',{method:'POST',body:fd}); }catch(e){}
  // 全文を txt として添付し、そのままスリンキーに送る（transcribe.py は .txt なら整形だけ行う）
  addFiles([new File([text],`${st.meeting}_文字起こし.txt`,{type:'text/plain'})]);
  if(!input.value.trim()) input.value='この文字起こしを議事録にして';
  if(current.id===st.bot.id) send();
}

async function send(){
  const text=input.value.trim(); const b=current;
  if(busy.has(b.id)||(!text&&!pending.length)) return;
  busy.add(b.id); sendBtn.disabled=true; ensureNotifyPermission();
  const files=pending.slice(); pending=[]; renderAttached();
  const sentAt=Date.now(), hiddenAtSend=document.hidden; let replyText='';
  append('msg me',esc(text)+fileChips(files.map(f=>f.name)));
  input.value=''; input.style.height='';
  const fd=new FormData(); fd.append('message',text); fd.append('bot',b.id==='_auto'?'':b.id);
  if(resetNext){fd.append('new_session','true');resetNext=false;} files.forEach(f=>fd.append('files',f));
  setStatus(b,'ちょっと待ってね…'); toollog.textContent='';
  try{
    const res=await fetch('/chat',{method:'POST',body:fd});
    const rd=res.body.getReader(), dec=new TextDecoder(); let buf='';
    while(true){
      const {value,done}=await rd.read(); if(done) break;
      buf+=dec.decode(value,{stream:true}); let i;
      while((i=buf.indexOf('\n\n'))>=0){
        const line=buf.slice(0,i).replace(/^data: /,''); buf=buf.slice(i+2); if(!line) continue;
        const ev=JSON.parse(line);
        if(ev.type==='text'){ replyText+=(replyText?'\n':'')+ev.text; const who=(ev.bot&&ev.bot!==b.id&&botOf(ev.bot))||b; if(current.id===b.id) append('msg bot-msg',botMsg(who,md(botChips(ev.text)))); }
        else if(ev.type==='tool'){ const w=(ev.bot&&ev.bot!==b.id&&botOf(ev.bot)); setStatus(b,(w?w.nick+'が':'')+spoken(ev.text)); toollog.textContent+=ev.text+'\n'; }
        else if(ev.type==='relay'){ if(current.id===b.id) append('relay-wrap',relayLine(ev.from,ev.from_nick,ev.to,ev.to_nick,ev.kind,ev.text)); setStatus(b,`${ev.to_nick}に${ev.kind==='聞く'?'聞いてる':'頼んでる'}…`); toollog.textContent+=`→ ${ev.to_nick}: ${ev.text}\n`; }
        else if(ev.type==='done'){ if(current.id===b.id) append('meta',`${ev.sec}s`);
          const away=document.hidden||!document.hasFocus()||current.id!==b.id;
          if(replyText&&(away||(notifySec>=0&&ev.sec>=notifySec))) notifyReply(b,replyText,ev.sec); }
        else if(ev.type==='error'){ append('error',esc(ev.text)); if(/api key|authenticat|oauth|not logged in/i.test(ev.text)) openSettings('認証に失敗しました。API キーを保存するか、claude で /login し直してください。'); }
      }
    }
  }catch(e){ append('error','サーバーに届きません。python app/server.py が動いているか確認してください。'); }
  busy.delete(b.id); setStatus(b,''); sendBtn.disabled=false; input.focus();
  const fresh=await (await fetch('/bots')).json(); bots=fresh; renderList(); refreshFiles(); loadTasks(); if(current.id===b.id) renderMemory(b);
}

sendBtn.onclick=send;
/* 送信キー: 設定で切替（ブラウザに記憶）。IME 変換確定の Enter では送らない */
let sendKey='enter'; try{ sendKey=localStorage.getItem('sendKey')||'enter'; }catch(e){}
function applySendKey(){
  const hint = sendKey==='ctrl' ? 'Ctrl+Enter で送信、Enter で改行' : 'Enter で送信、Shift+Enter で改行';
  input.placeholder=`メッセージ（${hint}。ファイルは画面のどこにでもドロップ）`;
  document.querySelectorAll('.empty').forEach(el=>{ el.innerHTML=el.innerHTML.replace(/(Enter で送信、Shift\+Enter で改行|Ctrl\+Enter で送信、Enter で改行)/, hint); });
}
input.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.isComposing) return;
  const fire = sendKey==='ctrl' ? (e.ctrlKey||e.metaKey) : (!e.shiftKey&&!e.ctrlKey&&!e.metaKey);
  if(fire){ e.preventDefault(); send(); }
});
$('#sendKey').onchange=e=>{ sendKey=e.target.value; try{ localStorage.setItem('sendKey',sendKey); }catch(e2){} applySendKey(); };
$('#sendKey').value=sendKey; applySendKey();
/* 返事ポップアップのしきい値（秒。-1 = 画面を見ていない時だけ。ブラウザに記憶） */
let notifySec=10; try{ const v=localStorage.getItem('notifySec'); if(v!==null) notifySec=parseInt(v,10); }catch(e){}
$('#notifySec').value=String(notifySec);
$('#notifySec').onchange=e=>{ notifySec=parseInt(e.target.value,10); try{ localStorage.setItem('notifySec',String(notifySec)); }catch(e2){} };
/* テーマ切替（ブラウザに記憶） */
let theme='auto'; try{ theme=localStorage.getItem('theme')||'auto'; }catch(e){}
$('#themeSel').value=theme;
$('#themeSel').onchange=e=>{ theme=e.target.value; if(theme==='auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme=theme; try{ localStorage.setItem('theme',theme); }catch(e2){} };
input.addEventListener('input',()=>{input.style.height='';input.style.height=Math.min(input.scrollHeight,220)+'px';});
$('#filter').addEventListener('input',renderList);
$('#pick').onclick=()=>$('#file').click();
$('#file').onchange=e=>{addFiles(e.target.files);e.target.value='';};
$('#newChat').onclick=()=>{ resetNext=true; log.innerHTML=''; append('meta','新しい会話（次の送信から前の文脈は引き継ぎません）'); };
$('#newBot').onclick=()=>alert('.claude/agents/ に <name>.md を置いて、ページを再読み込みしてください。');

/* ── 設定（API キー） ── */
const dlg=$('#settings'), apiKey=$('#apiKey'), setStatusEl=$('#setStatus');
function showSet(text,cls){ setStatusEl.textContent=text||''; setStatusEl.className='set-status '+(cls||''); }
async function loadSettings(){
  const st=await (await fetch('/settings')).json();
  $('#setFile').textContent=st.config_file;
  $('#setCurrent').textContent = st.api_key_set ? `現在: 画面で保存したキー（${st.api_key_hint}）を使用`
    : st.env_key_set ? '現在: 環境変数 ANTHROPIC_API_KEY を使用（ここで保存するとそちらより優先）'
    : '現在: 未設定（Claude Code のログインがあればそれを使用）';
  $('#setClear').disabled=!st.api_key_set;
  $('#openaiCurrent').textContent = st.openai_key_set ? `（保存済み ${st.openai_key_hint}）` : '（未設定）';
  $('#openaiClear').disabled=!st.openai_key_set;
  $('#trEngine').value=st.transcribe_engine||'auto'; $('#trUrl').value=st.remote_transcribe_url||'';
  $('#cfAccount').value=st.cf_account_id||''; $('#cfTokenCurrent').textContent=st.cf_token_set?'（保存済み）':'（未設定）';
  $('#trTokenCurrent').textContent=st.remote_token_set?'（保存済み）':'（未設定）';
  $('#trGlossary').value=st.glossary||''; $('#trChunk').value=st.chunk_sec||45;
  settingsCache=st;
  return st;
}
let settingsCache={};
$('#trSave').onclick=async()=>{
  const fd=new FormData();
  fd.append('transcribe_engine',$('#trEngine').value); fd.append('remote_transcribe_url',$('#trUrl').value);
  if($('#trToken').value.trim()) fd.append('remote_transcribe_token',$('#trToken').value.trim());
  fd.append('cf_account_id',$('#cfAccount').value); if($('#cfToken').value.trim()) fd.append('cf_api_token',$('#cfToken').value.trim());
  fd.append('glossary',$('#trGlossary').value); fd.append('chunk_sec',$('#trChunk').value);
  const r=await (await fetch('/settings',{method:'POST',body:fd})).json();
  if(!r.ok){ showSet(r.error,'ng'); return; }
  $('#trToken').value=''; $('#cfToken').value=''; await loadSettings(); showSet('文字起こし設定を保存しました。','ok');
};
$('#openaiSave').onclick=async()=>{
  const fd=new FormData(); fd.append('openai_api_key',$('#openaiKey').value);
  const r=await (await fetch('/settings',{method:'POST',body:fd})).json();
  if(!r.ok){ showSet(r.error,'ng'); return; }
  $('#openaiKey').value=''; await loadSettings(); showSet('文字起こしキーを保存しました。','ok');
};
$('#openaiClear').onclick=async()=>{
  const fd=new FormData(); fd.append('openai_api_key','');
  await fetch('/settings',{method:'POST',body:fd}); await loadSettings(); showSet('文字起こしキーを削除しました。','ok');
};
function openSettings(msg){ apiKey.value=''; showSet(msg||'', msg?'ng':''); loadSettings(); dlg.showModal(); apiKey.focus();
  fetch('/version').then(r=>r.json()).then(v=>{ $('#setVersion').textContent=`版: ${v.version}　フォルダ: ${v.folder}`; }).catch(()=>{}); }
$('#settingsBtn').onclick=()=>openSettings();
$('#powerBtn').onclick=async()=>{
  if(!confirm('サーバーを終了します。次に使うときは run.bat をダブルクリックしてください。')) return;
  try{ await fetch('/shutdown',{method:'POST'}); }catch(e){}
  document.body.innerHTML='<div class="empty" style="margin:auto;grid-column:1/-1">bot-team を終了しました。<br>次に使うときは run.bat をダブルクリックしてください（窓は出ません）。</div>';
};
$('#setClose').onclick=()=>{ dlg.close(); try{localStorage.setItem('settingsSeen','1');}catch(e){} };
$('#setSave').onclick=async()=>{
  const fd=new FormData(); fd.append('api_key',apiKey.value);
  const r=await (await fetch('/settings',{method:'POST',body:fd})).json();
  if(!r.ok){ showSet(r.error,'ng'); return; }
  apiKey.value=''; await loadSettings(); showSet('保存しました。「接続テスト」で確かめられます。','ok');
};
$('#setClear').onclick=async()=>{
  const fd=new FormData(); fd.append('api_key','');
  await fetch('/settings',{method:'POST',body:fd}); await loadSettings(); showSet('削除しました。','ok');
};
$('#setTest').onclick=async()=>{
  const btn=$('#setTest'); btn.disabled=true; showSet('接続中…');
  try{
    const r=await (await fetch('/settings/test',{method:'POST'})).json();
    showSet(r.ok?`接続できました（${r.sec}s）`:r.error, r.ok?'ok':'ng');
  }catch(e){ showSet('サーバーに届きません。','ng'); }
  btn.disabled=false;
};
loadSettings().then(st=>{ let seen=false; try{seen=!!localStorage.getItem('settingsSeen');}catch(e){} if(!st.api_key_set&&!st.env_key_set&&!seen) openSettings(); });
document.querySelectorAll('.tabs button').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected','false')); t.setAttribute('aria-selected','true');
  ['detail','log','files','tasks','memory'].forEach(p=>$('#pane-'+p).hidden=(p!==t.dataset.pane)); if(t.dataset.pane==='files') refreshFiles(); if(t.dataset.pane==='tasks') loadTasks(); if(t.dataset.pane==='memory') renderMemory(current);
});
let dragDepth=0;
document.addEventListener('dragenter',e=>{e.preventDefault();if(++dragDepth===1)document.body.classList.add('drag');});
document.addEventListener('dragleave',()=>{if(--dragDepth===0)document.body.classList.remove('drag');});
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{e.preventDefault();dragDepth=0;document.body.classList.remove('drag');addFiles(e.dataTransfer.files);input.focus();});
document.addEventListener('paste',e=>{if(e.clipboardData.files.length)addFiles(e.clipboardData.files);});
loadBots().then(()=>select(AUTO));
fetch('/version').then(r=>r.json()).then(v=>{ const [h,d]=(v.version||'').split(' '); $('#ver').textContent=h?`${h}${d?' '+d.slice(5).replace('-','/'):''}`:''; $('#ver').title=`版: ${v.version}（改善を取り込むたびに 1 増える）\nフォルダ: ${v.folder}`; }).catch(()=>{});
</script>
