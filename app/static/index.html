<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bot-team</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root{
  --bg:#F7F8FA; --side:#FFFFFF; --surface:#FFFFFF; --bubble:#F1F2F5; --ink:#1A2230; --muted:#6B7684;
  --line:#E3E6EB; --accent:#1F5FBF; --accent-ink:#FFF; --caution:#F2C32A; --err:#B3261E;
  --mono:ui-monospace,"SF Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#14181D; --side:#1B2026; --surface:#1B2026; --bubble:#232A32; --ink:#E7EBEF; --muted:#9AA5B1; --line:#2E353D; --accent:#5A8FE0; }
}
*{box-sizing:border-box} html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14.5px/1.7 "Noto Sans JP",system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;
  display:grid;grid-template-columns:270px 1fr 300px;grid-template-rows:100%;overflow:hidden}

/* ── 左: ボット一覧 ── */
aside.left{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.left-top{display:flex;align-items:center;gap:8px;padding:12px 14px 8px}
.left-top h1{font-size:15px;font-weight:700;margin:0;flex:1}
.icon-btn{border:1px solid var(--line);background:none;color:var(--ink);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1}
.icon-btn:hover{background:var(--bubble)}
.left-top input{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;background:var(--bg);color:var(--ink)}
.groups{overflow-y:auto;flex:1;padding:4px 8px 16px}
.group-name{font-size:12px;color:var(--muted);padding:14px 8px 4px}
.item{display:flex;gap:10px;align-items:center;padding:8px;border-radius:8px;cursor:pointer;border:0;background:none;width:100%;text-align:left;font:inherit;color:var(--ink)}
.item:hover{background:var(--bubble)} .item[aria-current="true"]{background:var(--bubble);outline:1px solid var(--line)}
/* ブロブ型アイコン: 形と色はボットごとに固定（id から生成）、選択中だけ形がヌルっと変わる */
.avatar{width:34px;height:34px;flex:none;display:inline-block;vertical-align:middle;overflow:visible}
.avatar .body{filter:drop-shadow(0 1.5px 2px rgba(0,0,0,.28))}
.avatar .eyes{transform-box:fill-box;transform-origin:center}
.avatar .pupils{transition:transform .12s ease-out}
.avatar .body.fixed{transform-box:fill-box;transform-origin:center}
.avatar.live .body.fixed{animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1) rotate(0deg)}50%{transform:scale(1.05) rotate(-2deg)}}
.avatar.live .eyes{animation:blink 4.5s ease-in-out infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
.item .t{min-width:0;flex:1} .item .n{font-weight:500;line-height:1.3} .item .p{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .p.live{color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;display:none}
.item.busy .dot{display:block;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.3}}

/* ── 中央: 会話 ── */
section.center{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.topbar .avatar{width:26px;height:26px;font-size:12px}
.topbar .name{font-weight:700}
.topbar .spacer{flex:1}
.topbar button.plain{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;cursor:pointer}
.topbar button.plain:hover{color:var(--ink)}
.log{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:12px}
.empty{color:var(--muted);text-align:center;margin:auto;line-height:2}
.msg{max-width:min(720px,88%);padding:12px 16px;border-radius:12px;word-break:break-word}
.me{background:var(--accent);color:var(--accent-ink);align-self:flex-end;border-bottom-right-radius:3px;white-space:pre-wrap}
.me .files{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.me .files span{font:12px var(--mono);background:rgba(255,255,255,.18);padding:2px 8px;border-radius:4px}
.bot-msg{background:var(--bubble);align-self:flex-start;border-bottom-left-radius:3px}
.bot-msg>:first-child{margin-top:0} .bot-msg>:last-child{margin-bottom:0}
.bot-msg h1,.bot-msg h2,.bot-msg h3{font-size:15px;margin:14px 0 4px}
.bot-msg ul,.bot-msg ol{padding-left:22px;margin:4px 0}
.bot-msg table{border-collapse:collapse;margin:8px 0;font-size:13.5px;display:block;overflow-x:auto}
.bot-msg td,.bot-msg th{border:1px solid var(--line);padding:3px 10px;text-align:left}
.bot-msg code{font:13px var(--mono);background:rgba(0,0,0,.06);padding:1px 4px;border-radius:3px}
.bot-msg pre{background:rgba(0,0,0,.06);padding:10px;border-radius:8px;overflow-x:auto}
.meta{font-size:12px;color:var(--muted);align-self:flex-start;padding-left:4px}
.error{color:var(--err);align-self:flex-start;font-size:13.5px}

.status{display:flex;align-items:center;gap:8px;padding:6px 24px;font-size:13px;color:var(--muted);min-height:34px}
.status .avatar{width:20px;height:20px;font-size:10px}
.status:empty{display:none}

.composer{padding:8px 20px 16px;background:var(--surface);border-top:1px solid var(--line)}
.attached{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px} .attached:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;font:12px var(--mono);background:var(--bubble);border:1px solid var(--line);padding:3px 4px 3px 9px;border-radius:6px}
.chip button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:14px;line-height:1;padding:0 4px}
.row{display:flex;gap:8px;align-items:flex-end;border:1px solid var(--line);border-radius:12px;padding:6px 8px 6px 6px;background:var(--bg)}
.row:focus-within{border-color:var(--accent)}
textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;line-height:1.6;min-height:36px;max-height:220px;padding:6px 4px}
.send{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:500;cursor:pointer}
.send:disabled{opacity:.45;cursor:default}
.rec{font-size:16px} .rec.on{background:var(--err);color:#fff;animation:pulse 1.2s infinite}
.rec-time{font:12px var(--mono);color:var(--err);align-self:center;min-width:52px;text-align:center} .rec-time:empty{display:none}
.live-box{max-width:min(820px,92%);width:100%} .live-text{white-space:pre-wrap;font-size:13.5px;line-height:1.7} .live-text:empty::before{content:"（まだ文字はありません）";color:var(--muted)}

/* ── 右: ボット詳細 ── */
aside.right{background:var(--side);border-left:1px solid var(--line);overflow-y:auto;padding:28px 18px}
.right .hero{text-align:center;margin-bottom:14px}
.right .hero .avatar{width:64px;height:64px;font-size:26px;margin:0 auto 10px}
.right .hero .n{font-weight:700;font-size:16px}
.tabs{display:flex;justify-content:center;gap:4px;margin-bottom:14px}
.tabs button{border:0;background:none;color:var(--muted);font:inherit;font-size:13px;padding:5px 12px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--bubble);color:var(--ink)}
.pane{font-size:13.5px} .pane dt{color:var(--muted);font-size:12px;margin-top:12px} .pane dd{margin:2px 0 0}
.pane .mono{font:12px var(--mono);word-break:break-all}
.toollog{font:12px var(--mono);color:var(--muted);border-left:2px solid var(--line);padding-left:10px;margin:0;white-space:pre-wrap;max-height:50vh;overflow-y:auto}
.filelist{list-style:none;padding:0;margin:0} .filelist li{font:12px var(--mono);padding:4px 0;border-bottom:1px solid var(--line);word-break:break-all}
/* サンプル置き場（右パネル） */
.samples{margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
.samples h3{font-size:12px;color:var(--muted);margin:0 0 4px;font-weight:500}
.slot{margin:8px 0 10px}
.slot .slot-h{display:flex;align-items:center;gap:8px}
.slot .slot-h b{font-weight:500;font-size:13px;flex:1}
.slot .add{border:1px solid var(--line);background:none;color:var(--accent);font:inherit;font-size:12px;border-radius:999px;padding:2px 10px;cursor:pointer}
.slot .add:hover{background:var(--bubble)}
.slot ul{list-style:none;padding:0;margin:4px 0 0}
.slot li{display:flex;align-items:center;gap:6px;font:12px var(--mono);padding:3px 0;word-break:break-all}
.slot li span{flex:1}
.slot li button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;padding:0 4px}
.slot li button:hover{color:var(--err)}
.slot .none{font-size:12px;color:var(--muted);margin-top:2px}
.slot.over{outline:2px dashed var(--accent);outline-offset:4px;border-radius:6px}

/* ドラッグ中: 注意テープ風の枠 */
body.drag::after{content:"ここに置くと添付されます";position:fixed;inset:12px;pointer-events:none;border:6px solid transparent;border-radius:14px;
  background:repeating-linear-gradient(45deg,var(--caution) 0 18px,var(--ink) 18px 36px) border-box;
  -webkit-mask:linear-gradient(#fff 0 0) padding-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:var(--ink)}
/* ── 設定ダイアログ ── */
dialog.settings{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:22px 24px;width:min(460px,92vw);font:inherit}
dialog.settings::backdrop{background:rgba(0,0,0,.35)}
dialog.settings h2{font-size:16px;margin:0 0 6px}
dialog.settings p{margin:6px 0;font-size:13px;color:var(--muted)}
dialog.settings label{display:block;font-size:12px;color:var(--muted);margin-top:14px}
dialog.settings input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:13px var(--mono);background:var(--bg);color:var(--ink);margin-top:4px}
dialog.settings .btns{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
dialog.settings .btns .spacer{flex:1}
dialog.settings button{font:inherit;font-size:13px;border-radius:8px;padding:7px 14px;cursor:pointer;border:1px solid var(--line);background:none;color:var(--ink)}
dialog.settings button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
dialog.settings button:disabled{opacity:.5;cursor:default}
.set-status{font-size:13px;margin-top:10px;min-height:1.6em;white-space:pre-wrap}
.set-status.ok{color:#2E8B57} .set-status.ng{color:var(--err)}
@media (max-width:980px){ body{grid-template-columns:230px 1fr} aside.right{display:none} }
@media (prefers-reduced-motion:reduce){ .item.busy .dot{animation:none} .avatar.live .eyes,.avatar.live .body.fixed{animation:none} }
</style>
</head>
<body>

<aside class="left">
  <div class="left-top"><h1>bot-team</h1><button class="icon-btn" id="powerBtn" title="サーバーを終了する（次回は run.bat から）">⏻</button><button class="icon-btn" id="settingsBtn" title="設定（API キー）">⚙</button><button class="icon-btn" id="newBot" title="ボットを追加する（.claude/agents にファイルを置く）">＋</button></div>
  <div class="left-top" style="padding-top:0"><input id="filter" placeholder="ボットを探す"></div>
  <div class="groups" id="groups"></div>
</aside>

<section class="center">
  <div class="topbar"><span class="avatar" id="topAvatar">?</span><span class="name" id="topName">ウッディ</span>
    <span class="spacer"></span><button class="plain" id="newChat">新しい会話</button></div>
  <div class="log" id="log"></div>
  <div class="status" id="status"></div>
  <div class="composer">
    <div class="attached" id="attached"></div>
    <div class="row">
      <button class="icon-btn" id="pick" title="ファイルを選ぶ" style="border:0">＋</button>
      <button class="icon-btn rec" id="rec" title="マイクで録音（もう一度押すと停止して添付）" style="border:0" hidden>🎙</button>
      <span class="rec-time" id="recTime"></span>
      <textarea id="input" rows="1" placeholder="メッセージ（Enter で送信、Shift+Enter で改行。ファイルは画面のどこにでもドロップ）"></textarea>
      <button class="send" id="send">送信</button>
    </div>
    <input type="file" id="file" multiple hidden>
  </div>
</section>

<aside class="right">
  <div class="hero"><span class="avatar" id="rAvatar">?</span><div class="n" id="rName">ウッディ</div></div>
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-pane="detail">詳細</button>
    <button role="tab" aria-selected="false" data-pane="log">作業ログ</button>
    <button role="tab" aria-selected="false" data-pane="files">ファイル</button>
  </div>
  <div class="pane" id="pane-detail"></div>
  <div class="pane" id="pane-log" hidden><pre class="toollog" id="toollog">（まだ何もしていません）</pre></div>
  <div class="pane" id="pane-files" hidden><ul class="filelist" id="filelist"></ul></div>
</aside>

<dialog class="settings" id="settings">
  <h2>設定</h2>
  <p id="setCurrent">読み込み中…</p>
  <label for="sendKey">送信キー</label>
  <select id="sendKey" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:13px;background:var(--bg);color:var(--ink);margin-top:4px">
    <option value="enter">Enter で送信（Shift+Enter で改行）</option>
    <option value="ctrl">Ctrl+Enter で送信（Enter で改行）</option>
  </select>
  <label for="apiKey">Anthropic API キー</label>
  <input id="apiKey" type="password" placeholder="sk-ant-api03-…" autocomplete="off" spellcheck="false">
  <p>キーは <a href="https://platform.claude.com/" target="_blank" rel="noopener">platform.claude.com</a> の API Keys で作れます。保存先はこの PC の <span class="mono" id="setFile">app/config.json</span> で、git には入りません。</p>
  <label for="openaiKey">文字起こし API キー（OpenAI、スリンキー用）<span id="openaiCurrent" style="margin-left:8px"></span></label>
  <div style="display:flex;gap:6px;align-items:center">
    <input id="openaiKey" type="password" placeholder="sk-…（platform.openai.com の API keys）" autocomplete="off" spellcheck="false" style="flex:1">
    <button type="button" id="openaiSave" style="font:inherit;font-size:13px;border-radius:8px;padding:7px 12px;cursor:pointer;border:1px solid var(--line);background:none;color:var(--ink)">保存</button>
    <button type="button" id="openaiClear" style="font:inherit;font-size:13px;border-radius:8px;padding:7px 12px;cursor:pointer;border:1px solid var(--line);background:none;color:var(--ink)">削除</button>
  </div>
  <details style="margin-top:14px"><summary style="cursor:pointer;font-size:13px;color:var(--muted)">ライブ録音・文字起こしの設定（スリンキー）</summary>
    <label for="trEngine">文字起こしエンジン</label>
    <select id="trEngine" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:13px;background:var(--bg);color:var(--ink);margin-top:4px">
      <option value="auto">自動（外部サーバー → OpenAI → ローカル Whisper の順で使えるもの）</option>
      <option value="openai">OpenAI（上の文字起こしキー）</option>
      <option value="whisper">ローカル Whisper（faster-whisper、鍵不要）</option>
      <option value="remote">外部サーバー（SYNAPSE の /api/minutes/transcribe など）</option>
    </select>
    <label for="trUrl">外部サーバーの URL</label>
    <input id="trUrl" type="text" placeholder="https://…/api/minutes/transcribe" autocomplete="off" spellcheck="false">
    <label for="trToken">外部サーバーのトークン <span id="trTokenCurrent" style="margin-left:8px"></span></label>
    <input id="trToken" type="password" placeholder="Bearer に入れる値（空で保存すると変更なし）" autocomplete="off">
    <label for="trGlossary">用語（案件名・人名・製品名・社内用語。カンマ区切り。固有名詞の誤りが減ります）</label>
    <textarea id="trGlossary" rows="2" placeholder="例: SYNAPSE, 藤原, 制御盤, FAT, 納期, KV-8000" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:13px;background:var(--bg);color:var(--ink);margin-top:4px;resize:vertical"></textarea>
    <label for="trChunk">区切りの長さ（秒、20〜90。既定 45）</label>
    <input id="trChunk" type="number" min="20" max="90" value="45" style="width:120px">
    <div class="btns" style="margin-top:10px"><span class="spacer"></span><button type="button" id="trSave">文字起こし設定を保存</button></div>
  </details>
  <div class="set-status" id="setStatus"></div>
  <div class="btns">
    <button type="button" id="setTest">接続テスト</button>
    <button type="button" id="setClear">キーを削除</button>
    <span class="spacer"></span>
    <button type="button" id="setClose">閉じる</button>
    <button type="button" class="primary" id="setSave">保存</button>
  </div>
</dialog>

<script>
const $=s=>document.querySelector(s);
const log=$('#log'), input=$('#input'), sendBtn=$('#send'), attachedEl=$('#attached'), statusEl=$('#status'), toollog=$('#toollog');
const AUTO={id:'_auto',nick:'ウッディ',desc:'おまかせ役。内容を見て適したボットに振り分けます。',group:'',model:'既定',tools:['Agent'],color:'#D98E5B',shape:'woody',preview:''};
let bots=[], current=AUTO, pending=[], busy=new Set(), resetNext=false;
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const md=s=>window.marked?marked.parse(s,{breaks:true}):esc(s).replace(/\n/g,'<br>');
/* id からブロブの形を決める。点の数 3〜7（3 は丸い三角、4 は丸い四角…）を Catmull-Rom で滑らかに閉じる */
const hash=id=>{ let h=2166136261; for(const ch of String(id)){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; };
const rng=seed=>{ let t=seed>>>0; return ()=>{ t+=0x6D2B79F5; let r=Math.imul(t^t>>>15,1|t); r^=r+Math.imul(r^r>>>7,61|r); return ((r^r>>>14)>>>0)/4294967296; }; };
function blobPts(seed,frame){
  const r=rng(seed), n=3+Math.floor(r()*5), base=[];
  for(let i=0;i<n;i++) base.push([(i/n)*Math.PI*2+(r()-.5)*.6, 37+(r()-.5)*12]);
  const w=rng(seed*7+frame*131);
  return base.map(([a,rad])=>{ const da=frame?(w()-.5)*.25:0, dr=frame?(w()-.5)*12:0; return [50+Math.cos(a+da)*(rad+dr), 50+Math.sin(a+da)*(rad+dr)]; });
}
function toPath(p){
  const n=p.length, f=v=>v.toFixed(1); let d=`M${f(p[0][0])} ${f(p[0][1])}`;
  for(let i=0;i<n;i++){ const p0=p[(i-1+n)%n],p1=p[i],p2=p[(i+1)%n],p3=p[(i+2)%n];
    d+=`C${f(p1[0]+(p2[0]-p0[0])/6)} ${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)} ${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])} ${f(p2[1])}`; }
  return d+'Z';
}
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const hex2rgb=h=>{ h=h.replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join(''); const n=parseInt(h,16); return [n>>16&255,n>>8&255,n&255]; };
const mix=(c,t,a)=>{ const [r,g,b]=hex2rgb(c); return `rgb(${Math.round(r+(t[0]-r)*a)},${Math.round(g+(t[1]-g)*a)},${Math.round(b+(t[2]-b)*a)})`; };
let gid=0;
/* 固定シルエット（フロントマター shape: で指定）。d はパス、ex/ey は目の中心、dx は目の間隔の半分、er は目の半径 */
const SHAPES={

  slinky:{d:'M8 46C8 28 36 26 38 44L38 50C55 48 72 48 86 50C90 44 94 38 96 36C97 44 94 54 90 60C92 70 86 74 78 74L30 74C20 74 14 70 12 60C8 56 8 52 8 46Z', ex:22, ey:40, dx:6, er:5},

/* 瞳がマウスを追う（選択中のアイコンだけ）: アイコン中心からマウスへの向きに、最大 3.2 単位だけ瞳をずらす */
let mouse=null, eyeRaf=0;
function trackEyes(){
  eyeRaf=0;
  document.querySelectorAll('svg.avatar').forEach(sv=>{
    const g=sv.querySelector('.pupils'); if(!g) return;
    if(!sv.classList.contains('live')){ g.style.transform=''; return; }
    if(!mouse){ g.style.transform=''; return; }
    const r=sv.getBoundingClientRect(); if(!r.width) return;
    const cx=r.left+r.width/2, cy=r.top+r.height*.45;
    const er=parseFloat(sv.querySelector('.eyes circle')?.getAttribute('r')||8);
    const vx=mouse[0]-cx, vy=mouse[1]-cy, dist=Math.hypot(vx,vy)||1, m=Math.min(1,dist/140)*3.2*(er/8);
    g.style.transform=`translate(${(vx/dist*m).toFixed(2)}px,${(vy/dist*m).toFixed(2)}px)`;
  });
}
document.addEventListener('mousemove',e=>{ mouse=[e.clientX,e.clientY]; if(!eyeRaf) eyeRaf=requestAnimationFrame(trackEyes); });
document.addEventListener('mouseleave',()=>{ mouse=null; trackEyes(); });

/* ── ライブ録音（スリンキー）: マイク（＋任意でオンライン会議のタブ音声）を 1 本に合成し、
   区切りごとに stop→start で完結した webm を作って /transcribe/chunk に順番に送る。
   文字は届き次第チャットに出し、停止すると全文を文字起こし txt として添付してスリンキーに送る。 ── */
let live=null;
function fmtT(sec){ const s=Math.floor(sec); return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
async function toggleRec(){
  if(live){ await stopLive(); return; }
  const b=current;
  const includeTab = confirm('Google Meet の音声（相手の声）も一緒に録りますか？\n\nOK → 次に出る共有の選択で「Chrome タブ」→ Meet のタブを選び、左下の「タブの音声も共有する」をオンにして「共有」。\n　　 （自分の声はマイクから録るので、Meet 側のマイクはそのままで構いません）\nキャンセル → マイクだけ録ります（対面会議向け）。');
  let mic, tab=null, ctx;
  try{ mic=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}); }
  catch(e){ alert('マイクを使えませんでした。ブラウザのマイク許可を確認してください。\n'+e.message); return; }
  ctx=new AudioContext(); const dest=ctx.createMediaStreamDestination(); ctx.createMediaStreamSource(mic).connect(dest);
  if(includeTab){
    try{ tab=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true}); tab.getVideoTracks().forEach(t=>t.stop());
      if(tab.getAudioTracks().length) ctx.createMediaStreamSource(tab).connect(dest); else alert('タブの音声が取れませんでした。共有の選択で「Chrome タブ」を選び、「タブの音声も共有する」をオンにしてください。今回はマイクだけで続けます。'); }
    catch(e){ tab=null; }
  }
  const mime=['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'].find(m=>MediaRecorder.isTypeSupported(m));
  const d=new Date(), pad=n=>String(n).padStart(2,'0');
  const meeting=`録音_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`;
  const chunkMs=((settingsCache.chunk_sec)||45)*1000, glossary=settingsCache.glossary||'';
  const st={bot:b,meeting,mic,tab,ctx,dest,mime,t0:Date.now(),seq:0,prev:'',stopping:false,rec:null,timer:0,queue:Promise.resolve(),lines:[],errors:0};
  live=st;
  // 画面: 会話欄にライブ本文の枠
  log.querySelector('.empty')?.remove();
  st.el=append('msg bot-msg live-box',`<div class="meta" style="padding:0 0 6px">● 録音中 — 文字は区切り（${chunkMs/1000}秒）ごとに出ます</div><div class="live-text"></div>`);
  const upload=async(blob,seq,startSec)=>{
    const fd=new FormData(); fd.append('audio',blob,`chunk-${seq}.webm`); fd.append('seq',seq); fd.append('startSec',startSec);
    fd.append('language','ja'); fd.append('glossary',glossary); fd.append('prev',st.prev); fd.append('meeting',meeting);
    const res=await fetch('/transcribe/chunk',{method:'POST',body:fd});
    if(!res.ok) throw new Error(`transcribe ${res.status}`);
    const r=await res.json();
    if(r.error){ st.errors++; setStatus(b,'文字起こしエラー: '+r.error); if(st.errors===1) append('error',esc(r.error)); return; }
    if(r.text){ st.prev=r.text.slice(-300); st.lines.push(`[${fmtT(startSec)}] ${r.text}`); const t=st.el.querySelector('.live-text'); t.textContent=st.lines.join('\n'); log.scrollTop=log.scrollHeight; }
  };
  const begin=()=>{
    const r=new MediaRecorder(dest.stream, mime?{mimeType:mime,audioBitsPerSecond:32000}:undefined);
    const chunks=[]; const startSec=(Date.now()-st.t0)/1000; const mySeq=st.seq++;
    r.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
    r.stopped=new Promise(res=>{ r.onstop=()=>{ const blob=new Blob(chunks,{type:r.mimeType||'audio/webm'});
      if(blob.size>=2000) st.queue=st.queue.then(()=>upload(blob,mySeq,startSec)).catch(e=>{ st.errors++; setStatus(b,'送信失敗: '+e.message); });
      res(); }; });
    r.start(); st.rec=r; clearTimeout(st.timer); st.timer=setTimeout(rotate,chunkMs);
  };
  /* 区切りを閉じて（onstop を待ってから）次を始める。停止時はその promise で最後の区切りが待ち行列に入ったことを確かめる */
  const rotate=()=>{ const cur=st.rec; if(!cur) return Promise.resolve(); st.rec=null; cur.stop(); if(!st.stopping) begin(); return cur.stopped; };
  st.rotate=rotate; begin();
  $('#rec').classList.add('on'); input.placeholder='録音中… 🎙 をもう一度押すと停止して議事録を作ります';
  st.clock=setInterval(()=>{ $('#recTime').textContent='● '+fmtT((Date.now()-st.t0)/1000); },500);
}
async function stopLive(){
  const st=live; if(!st) return; live=null;
  st.stopping=true; clearTimeout(st.timer); const lastStopped=st.rotate();
  $('#rec').classList.remove('on'); clearInterval(st.clock); $('#recTime').textContent='';
  setStatus(st.bot,'最後の区切りを文字にしています'); await lastStopped; await st.queue;
  st.mic.getTracks().forEach(t=>t.stop()); st.tab?.getTracks().forEach(t=>t.stop()); try{ await st.ctx.close(); }catch(e){}
  applySendKey(); setStatus(st.bot,'');
  st.el.querySelector('.meta').textContent=`■ 録音終了（${fmtT((Date.now()-st.t0)/1000)}）`;
  const text=st.lines.join('\n');
  if(!text.trim()){ append('error','文字が取れませんでした。マイクや文字起こしの設定（⚙）を確認してください。'); return; }
  const fd=new FormData(); fd.append('meeting',st.meeting); fd.append('text',text);
  try{ await fetch('/transcribe/finish',{method:'POST',body:fd}); }catch(e){}
  // 全文を txt として添付し、そのままスリンキーに送る（transcribe.py は .txt なら整形だけ行う）
  addFiles([new File([text],`${st.meeting}_文字起こし.txt`,{type:'text/plain'})]);
  if(!input.value.trim()) input.value='この文字起こしを議事録にして';
  if(current.id===st.bot.id) send();
}

    while(true){
      const {value,done}=await rd.read(); if(done) break;
      buf+=dec.decode(value,{stream:true}); let i;

        const line=buf.slice(0,i).replace(/^data: /,''); buf=buf.slice(i+2); if(!line) continue;
        const ev=JSON.parse(line);

}

  fd.append('glossary',$('#trGlossary').value); fd.append('chunk_sec',$('#trChunk').value);
  const r=await (await fetch('/settings',{method:'POST',body:fd})).json();
  if(!r.ok){ showSet(r.error,'ng'); return; }
  $('#trToken').value=''; await loadSettings(); showSet('文字起こし設定を保存しました。','ok');
};
$('#openaiSave').onclick=async()=>{
  const fd=new FormData(); fd.append('openai_api_key',$('#openaiKey').value);
  const r=await (await fetch('/settings',{method:'POST',body:fd})).json();
  if(!r.ok){ showSet(r.error,'ng'); return; }
  $('#openaiKey').value=''; await loadSettings(); showSet('文字起こしキーを保存しました。','ok');
};
$('#openaiClear').onclick=async()=>{
  const fd=new FormData(); fd.append('openai_api_key','');
  await fetch('/settings',{method:'POST',body:fd}); await loadSettings(); showSet('文字起こしキーを削除しました。','ok');
};
function openSettings(msg){ apiKey.value=''; showSet(msg||'', msg?'ng':''); loadSettings(); dlg.showModal(); apiKey.focus(); }
$('#settingsBtn').onclick=()=>openSettings();
$('#powerBtn').onclick=async()=>{
  if(!confirm('サーバーを終了します。次に使うときは run.bat をダブルクリックしてください。')) return;
  try{ await fetch('/shutdown',{method:'POST'}); }catch(e){}
  document.body.innerHTML='<div class="empty" style="margin:auto;grid-column:1/-1">bot-team を終了しました。<br>次に使うときは run.bat をダブルクリックしてください（窓は出ません）。</div>';
};
$('#setClose').onclick=()=>{ dlg.close(); try{localStorage.setItem('settingsSeen','1');}catch(e){} };
$('#setSave').onclick=async()=>{
  const fd=new FormData(); fd.append('api_key',apiKey.value);
  const r=await (await fetch('/settings',{method:'POST',body:fd})).json();
  if(!r.ok){ showSet(r.error,'ng'); return; }
  apiKey.value=''; await loadSettings(); showSet('保存しました。「接続テスト」で確かめられます。','ok');
};
$('#setClear').onclick=async()=>{
  const fd=new FormData(); fd.append('api_key','');
  await fetch('/settings',{method:'POST',body:fd}); await loadSettings(); showSet('削除しました。','ok');
};
$('#setTest').onclick=async()=>{
  const btn=$('#setTest'); btn.disabled=true; showSet('接続中…');
  try{
    const r=await (await fetch('/settings/test',{method:'POST'})).json();
    showSet(r.ok?`接続できました（${r.sec}s）`:r.error, r.ok?'ok':'ng');
  }catch(e){ showSet('サーバーに届きません。','ng'); }
  btn.disabled=false;
};
loadSettings().then(st=>{ let seen=false; try{seen=!!localStorage.getItem('settingsSeen');}catch(e){} if(!st.api_key_set&&!st.env_key_set&&!seen) openSettings(); });
document.querySelectorAll('.tabs button').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected','false')); t.setAttribute('aria-selected','true');
  ['detail','log','files'].forEach(p=>$('#pane-'+p).hidden=(p!==t.dataset.pane)); if(t.dataset.pane==='files') refreshFiles();
});
let dragDepth=0;
document.addEventListener('dragenter',e=>{e.preventDefault();if(++dragDepth===1)document.body.classList.add('drag');});
document.addEventListener('dragleave',()=>{if(--dragDepth===0)document.body.classList.remove('drag');});
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{e.preventDefault();dragDepth=0;document.body.classList.remove('drag');addFiles(e.dataTransfer.files);input.focus();});
document.addEventListener('paste',e=>{if(e.clipboardData.files.length)addFiles(e.clipboardData.files);});
loadBots().then(()=>select(AUTO));
</script>
</body>
</html>
